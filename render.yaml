# Render gratuit + PostgreSQL externe (Neon). Pas de disque local nécessaire.
services:
  - type: web
    name: wordchain-game
    runtime: node
    region: frankfurt
    plan: free
    numInstances: 1
    buildCommand: npm ci --include=dev && npm test && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: GEOIP_API_ENABLED
        value: "1"
